name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Recording mode
      options: [Online meeting / call, In person, Transcribe a file, Not related to recording]
  - type: input
    id: version
    attributes:
      label: Offrecord version
      description: Settings › About, or `~/Applications/Offrecord.app/Contents/MacOS/Offrecord --version`
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.1, MacBook Air M2
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Transcription language
      placeholder: English (US)
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove anything private from transcripts before posting.
